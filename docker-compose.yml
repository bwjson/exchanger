services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exchanger
      POSTGRES_PASSWORD: exchanger
      POSTGRES_DB: exchanger
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchanger -d exchanger"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      POSTGRES_DSN: postgres://exchanger:exchanger@postgres:5432/exchanger?sslmode=disable
      CURRENCY_API_KEY: ${CURRENCY_API_KEY:?set CURRENCY_API_KEY in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
