version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Start postgres
    cmds:
      - docker compose up -d postgres

  down:
    desc: Stop postgres
    cmds:
      - docker compose down

  run:
    desc: Run app
    cmds:
      - go run ./cmd/app

  test:
    desc: Run tests
    cmds:
      - go test ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w cmd internal

  lint:
    desc: Run linter
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run

  docs:
    desc: Generate swagger docs
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/app/main.go -o internal/docs --parseInternal

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  migrate:up:
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.24.3 -dir migrations postgres "$POSTGRES_DSN" up

  migrate:down:
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.24.3 -dir migrations postgres "$POSTGRES_DSN" down

  migrate:status:
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.24.3 -dir migrations postgres "$POSTGRES_DSN" status

  migrate:create:
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.24.3 -dir migrations create "{{.NAME}}" sql
